<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thông Tin Sinh Viên - Khoa CNTT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="hero">
    <div class="logo-doan">
        <h1>ĐOÀN - HỘI KHOA CÔNG NGHỆ THÔNG TIN</h1>
        <h1>TRANG THÔNG TIN VÀ SỰ KIỆN</h1>
    </div>
    <div class="stats-badge" id="activityCount">Đang kết nối...</div>
</div>

<div class="container">
    <div class="toolbar">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Chuyển giao diện">
            <i class="fas fa-moon"></i>
        </button>
        <div class="filter-tabs" id="typeTabs">
            <button class="tab-btn active" onclick="setTab('TẤT CẢ')">Tất cả</button>
            <button class="tab-btn" onclick="setTab('CUỘC THI')">Cuộc thi</button>
            <button class="tab-btn" onclick="setTab('WORKSHOP')">Workshop</button>
            <button class="tab-btn" onclick="setTab('HOẠT ĐỘNG')">Hoạt động</button>
        </div>
        <div class="search-row">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên hoạt động, đơn vị..." oninput="onSearch()">
            </div>
            <select id="monthFilter" class="month-picker" onchange="onMonth()">
                <option value="ALL">Mọi tháng</option>
                <option value="01">Tháng 1</option><option value="02">Tháng 2</option><option value="03">Tháng 3</option>
                <option value="04">Tháng 4</option><option value="05">Tháng 5</option><option value="06">Tháng 6</option>
                <option value="07">Tháng 7</option><option value="08">Tháng 8</option><option value="09">Tháng 9</option>
                <option value="10">Tháng 10</option><option value="11">Tháng 11</option><option value="12">Tháng 12</option>
            </select>
            <button class="export-btn" onclick="exportMonthFromSelect()"><i class="fas fa-file-excel"></i> Xuất file tháng</button>
        </div>
    </div>

    <div class="grid" id="mainGrid">
        <div class="loader" style="text-align: center; grid-column: 1/-1;">Đang tải dữ liệu hoạt động...</div>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<div id="toast">✅ Đã sao chép nội dung chia sẻ!</div>

<div class="modal" id="modalOverlay" onclick="closeM(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-h"><h2 id="mTitle" style="margin:0; font-size:1.3rem;"></h2></div>
        <div class="modal-b" id="mBody"></div>
        <div class="card-foot" id="mFooter"></div>
    </div>
</div>


<button class="chatbot-toggle" onclick="toggleChatbot()" title="Chatbot tư vấn hoạt động">
    <i class="fas fa-comments"></i>
</button>

<div class="chatbot-panel" id="chatbotPanel">
    <div class="chatbot-header">
        <div>
            <strong>Chatbot hoạt động</strong>
            <small>Đọc dữ liệu trực tiếp từ danh sách</small>
        </div>
        <div style="display:flex; align-items:center; gap:0;">
            <button class="chatbot-suggestion-toggle" id="suggestionToggleBtn" onclick="toggleSuggestions()" title="Ẩn/hiện phần gợi ý">Ẩn gợi ý</button>
            <button class="chatbot-close" onclick="toggleChatbot(false)"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="chatbot-messages" id="chatMessages"></div>
    <div class="chatbot-suggestions" id="chatSuggestions">
        <button class="chat-chip" onclick="askBot('Hoạt động đang mở')">Đang mở</button>
        <button class="chat-chip" onclick="askBot('Hoạt động sắp hết hạn')">Sắp hết hạn</button>
        <button class="chat-chip" onclick="askBot('Hoạt động có CTXH')">Có CTXH</button>
        <button class="chat-chip" onclick="askBot('Link đăng ký các hoạt động')">Link đăng ký</button>
        <button class="chat-chip" onclick="askBot('Workshop đang mở')">Workshop</button>
        <button class="chat-chip" onclick="askBot('Cuộc thi đang mở')">Cuộc thi</button>
        <button class="chat-chip" onclick="askBot('Tình nguyện đang mở')">Tình nguyện</button>
        <button class="chat-chip" onclick="askBot('Hướng dẫn')">Hướng dẫn</button>
    </div>
    <form class="chatbot-form" onsubmit="sendChat(event)">
        <input id="chatInput" type="text" placeholder="Hỏi: hoạt động đang mở, sắp hết hạn, có CTXH, link đăng ký, địa điểm workshop...">
        <button type="submit"><i class="fas fa-paper-plane"></i></button>
    </form>
</div>

<div class="footer">
    <p>&copy; 2026 Đoàn - Hội Khoa CNTT. <br>
       Liên hệ: <a href="https://www.facebook.com/doankhoacnttdntu" target="_blank" rel="noopener noreferrer">Fanpage Đoàn - Hội Khoa CNTT</a>
    </p>
</div>
<div class="visitor-badge-wrap"><span class="visitor-static-badge"><i class="fas fa-globe"></i> GitHub Pages</span></div>

<script src="./app.js"></script>
</body>
</html>
