<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thông Tin Sinh Viên - Khoa CNTT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="hero">
    <div class="logo-doan">
        <h1>ĐOÀN - HỘI KHOA CÔNG NGHỆ THÔNG TIN</h1>
        <h1>TRANG THÔNG TIN VÀ SỰ KIỆN</h1>
    </div>
    <div class="stats-badge" id="activityCount">Đang kết nối...</div>
</div>

<div class="container">
    <div class="toolbar">
        <button class="theme-toggle" id="themeToggle" title="Chuyển giao diện">
            <i class="fas fa-moon"></i>
        </button>
        <div class="filter-tabs" id="typeTabs">
            <button class="tab-btn active" data-tab="TẤT CẢ">Tất cả</button>
            <button class="tab-btn" data-tab="CUỘC THI">Cuộc thi</button>
            <button class="tab-btn" data-tab="WORKSHOP">Workshop</button>
            <button class="tab-btn" data-tab="HOẠT ĐỘNG">Hoạt động</button>
        </div>
        <div class="search-row">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên hoạt động, đơn vị...">
            </div>
            <select id="monthFilter" class="month-picker">
                <option value="ALL">Mọi tháng</option>
                <option value="01">Tháng 1</option><option value="02">Tháng 2</option><option value="03">Tháng 3</option>
                <option value="04">Tháng 4</option><option value="05">Tháng 5</option><option value="06">Tháng 6</option>
                <option value="07">Tháng 7</option><option value="08">Tháng 8</option><option value="09">Tháng 9</option>
                <option value="10">Tháng 10</option><option value="11">Tháng 11</option><option value="12">Tháng 12</option>
            </select>
            <button class="export-btn" type="button"><i class="fas fa-file-excel"></i> Xuất file tháng</button>
        </div>
    </div>

    <div class="grid" id="mainGrid">
        <div class="loader">Đang tải dữ liệu hoạt động...</div>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<div id="toast">✅ Đã sao chép nội dung chia sẻ!</div>

<div class="modal" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-h"><h2 id="mTitle" class="modal-title"></h2></div>
        <div class="modal-b" id="mBody"></div>
        <div class="card-foot" id="mFooter"></div>
    </div>
</div>


<button class="chatbot-toggle" title="Chatbot tư vấn hoạt động">
    <i class="fas fa-comments"></i>
</button>

<div class="chatbot-panel" id="chatbotPanel">
    <div class="chatbot-header">
        <div>
            <strong>Chatbot hoạt động</strong>
            <small>Đọc dữ liệu trực tiếp từ danh sách</small>
        </div>
        <div class="chatbot-header-actions">
            <button class="chatbot-suggestion-toggle" id="suggestionToggleBtn" title="Ẩn/hiện phần gợi ý">Ẩn gợi ý</button>
            <button class="chatbot-close" type="button"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="chatbot-messages" id="chatMessages"></div>
    <div class="chatbot-suggestions" id="chatSuggestions">
        <button class="chat-chip" type="button" data-question="Hoạt động đang mở">Đang mở</button>
        <button class="chat-chip" type="button" data-question="Hoạt động sắp hết hạn">Sắp hết hạn</button>
        <button class="chat-chip" type="button" data-question="Hoạt động có CTXH">Có CTXH</button>
        <button class="chat-chip" type="button" data-question="Link đăng ký các hoạt động">Link đăng ký</button>
        <button type="button" class="chat-chip" data-question="Workshop đang mở">Workshop</button>
        <button type="button" class="chat-chip" data-question="Cuộc thi đang mở">Cuộc thi</button>
        <button type="button" class="chat-chip" data-question="Tình nguyện đang mở">Tình nguyện</button>
        <button type="button" class="chat-chip" data-question="Hướng dẫn">Hướng dẫn</button>
    </div>
    <form class="chatbot-form">
        <input id="chatInput" type="text" placeholder="Hỏi: hoạt động đang mở, sắp hết hạn, có CTXH, link đăng ký, địa điểm workshop...">
        <button type="submit"><i class="fas fa-paper-plane"></i></button>
    </form>
</div>

<div class="footer">
    <p>&copy; 2026 Đoàn - Hội Khoa CNTT. <br>
       Liên hệ: <a href="https://www.facebook.com/doankhoacnttdntu" target="_blank" rel="noopener noreferrer">Fanpage Đoàn - Hội Khoa CNTT</a>
    </p>
</div>
<div class="visitor-badge-wrap"><span class="visitor-static-badge"><i class="fas fa-globe"></i> GitHub Pages</span></div>

<script src="./app.js"></script>
</body>
</html>
